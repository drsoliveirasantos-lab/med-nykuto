name: Med Nykuto CI status notifier

on:
  workflow_run:
    workflows:
      - Med Nykuto site tests
    types:
      - completed
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: med-nykuto-ci-status-and-recovery
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'workflow_run'
    name: Publish CI status comment
    runs-on: ubuntu-latest
    steps:
      - name: Comment CI status on issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = 1;
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion || 'unknown';
            const emoji = conclusion === 'success' ? '✅' : conclusion === 'failure' ? '❌' : conclusion === 'cancelled' ? '⚪' : '⚠️';
            const sha = (run.head_sha || '').slice(0, 7);
            const branch = run.head_branch || 'unknown';
            const title = `${emoji} ${run.name} #${run.run_number} — ${conclusion.toUpperCase()}`;
            const body = [
              title,
              '',
              `- Branch: \`${branch}\``,
              `- Commit: \`${sha}\``,
              `- Event: \`${run.event}\``,
              `- Status: \`${run.status}\``,
              `- Conclusion: \`${conclusion}\``,
              `- Started: ${run.created_at}`,
              `- Updated: ${run.updated_at}`,
              `- Run: ${run.html_url}`,
              '',
              '<!-- med-nykuto-ci-status-notifier -->'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });

  recover-main:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Verify main CI and retry proven transient failures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      # Never check out the triggering run's branch or execute downloaded artifacts.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Monitor the current main revision
        uses: actions/github-script@v7
        with:
          script: |
            const monitor = require('./scripts/monitor-main-ci.js');
            await monitor({ github, context, core });
