name: Validate latest main targeted state

on:
  push:
    branches:
      - work/ci-reconcile-20260828

permissions:
  contents: read

jobs:
  static-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate current contracts
        run: |
          node scripts/validate-public-theme.js
          node scripts/validate-p1-s4.js
          node scripts/validate-p2-s4.js
          node scripts/validate-community-ranking.js
          node scripts/validate-site-links.js
          node scripts/validate-strict-html-js-health.js
      - name: Install Chromium
        run: timeout 300s npx playwright install --with-deps chromium
      - name: Run current desktop regressions
        run: npx playwright test tests/p1.spec.js tests/p2.spec.js tests/grupo3-hub.spec.js tests/community-leaderboard.spec.js --project=desktop-chromium --workers=1

  mobile-and-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium and WebKit
        run: timeout 360s npx playwright install --with-deps chromium webkit
      - name: Run mobile touch regressions
        run: npx playwright test tests/mobile-touch-critical.spec.js --project=mobile-safari-shape --workers=1
      - name: Audit compact notebook
        run: npm run audit:notebook-ui
