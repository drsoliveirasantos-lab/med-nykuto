name: Persist validated current-state reconciliation

on:
  push:
    branches:
      - work/ci-reconcile-20260828

permissions:
  contents: write

jobs:
  persist:
    if: ${{ !contains(github.event.head_commit.message, '[persisted]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ci-reconcile-20260828
          fetch-depth: 0
      - name: Recreate the already validated tree
        run: |
          python3 .github/scripts/reconcile-current-state-20260828.py
          python3 .github/scripts/reconcile-current-state-followup-20260828.py
          cp .github/workflows/site-tests.yml site-tests-reconciled-20260828.yml
      - name: Persist non-workflow files
        run: |
          git config user.name "Med Nykuto CI Reconciler"
          git config user.email "actions@users.noreply.github.com"
          git add \
            site-tests-reconciled-20260828.yml \
            bioquimica-pratica-task-v498.js \
            public-theme-v485.js \
            clase.html \
            tests/grupo3-hub/section-01.js \
            tests/grupo3-hub/section-02.js \
            tests/grupo3-hub/section-03.js \
            tests/grupo3-hub/section-04.js \
            tests/grupo3-hub/section-05.js \
            tests/grupo3-hub/section-06.js \
            tests/grupo3-hub/section-07.js \
            tests/grupo3-hub/section-08.js \
            tests/grupo3-hub/section-10.js \
            tests/grupo3-hub/section-11.js \
            tests/mobile-touch-critical/section-02.js \
            tests/mobile-touch-critical/section-03.js \
            tests/community-leaderboard.spec.js \
            tests/p2.spec.js
          git commit -m "fix(ci): persist validated current class state [persisted]"
          git push origin HEAD:work/ci-reconcile-20260828
