<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Regulación de la glucólisis</title><desc id="desc">Mapa de los tres pasos irreversibles de la glucólisis y sus reguladores principales.</desc>
  <rect width="1200" height="760" rx="36" fill="#071521"/>
  <text x="64" y="76" fill="#34d399" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">BIOQUÍMICA II · 19 AGO. 2026</text>
  <text x="64" y="130" fill="#f8fafc" font-family="Arial,sans-serif" font-size="42" font-weight="800">Tres puertas irreversibles de la glucólisis</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(64 205)"><rect width="1072" height="130" rx="25" fill="#0d2d3d" stroke="#38bdf8" stroke-width="3"/><circle cx="68" cy="65" r="35" fill="#38bdf8"/><text x="68" y="76" text-anchor="middle" fill="#071521" font-size="30" font-weight="800">1</text><text x="130" y="50" fill="#fff" font-size="27" font-weight="800">Hexoquinasa / glucoquinasa</text><text x="130" y="88" fill="#bae6fd" font-size="19">Glucosa → glucosa-6-fosfato · gasta ATP</text><text x="710" y="51" fill="#4ade80" font-size="18" font-weight="700">↑ insulina (hígado)</text><text x="710" y="89" fill="#fb7185" font-size="18" font-weight="700">↓ G6P inhibe hexoquinasa</text></g>
    <g transform="translate(64 365)"><rect width="1072" height="130" rx="25" fill="#222052" stroke="#818cf8" stroke-width="3"/><circle cx="68" cy="65" r="35" fill="#818cf8"/><text x="68" y="76" text-anchor="middle" fill="#071521" font-size="30" font-weight="800">3</text><text x="130" y="50" fill="#fff" font-size="27" font-weight="800">PFK-1 · paso limitante</text><text x="130" y="88" fill="#c7d2fe" font-size="19">F6P → F1,6BP · gasta ATP</text><text x="640" y="51" fill="#4ade80" font-size="18" font-weight="700">↑ AMP · ADP · F2,6BP</text><text x="640" y="89" fill="#fb7185" font-size="18" font-weight="700">↓ ATP · citrato · pH bajo</text></g>
    <g transform="translate(64 525)"><rect width="1072" height="130" rx="25" fill="#2b2412" stroke="#fbbf24" stroke-width="3"/><circle cx="68" cy="65" r="35" fill="#fbbf24"/><text x="68" y="76" text-anchor="middle" fill="#071521" font-size="30" font-weight="800">10</text><text x="130" y="50" fill="#fff" font-size="27" font-weight="800">Piruvato quinasa</text><text x="130" y="88" fill="#fde68a" font-size="19">PEP → piruvato · forma ATP</text><text x="660" y="51" fill="#4ade80" font-size="18" font-weight="700">↑ F1,6BP · desfosforilación</text><text x="660" y="89" fill="#fb7185" font-size="18" font-weight="700">↓ ATP · alanina · glucagón hepático</text></g>
  </g>
  <text x="64" y="710" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18">Clave: la disponibilidad de energía y las hormonas ajustan el flujo; el O₂ no es sustrato directo de la vía.</text>
</svg>
