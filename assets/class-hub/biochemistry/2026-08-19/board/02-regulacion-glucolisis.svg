<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
  <title id="title">Puntos de regulación de la glucólisis: hexoquinasa, glucoquinasa y PFK-1</title>
  <desc id="desc">Reconstrucción semántica sobre fondo blanco de la pizarra del 19 de agosto. Conserva el orden vertical, los colores y las relaciones entre hexoquinasa, glucoquinasa, GKRP y PFK-1. Al pie hay aclaraciones didácticas separadas del contenido original.</desc>
  <defs>
    <marker id="arrow-reg-navy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#17324d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-reg-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l10 5-10 5" fill="none" stroke="#c6525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="reg-paper-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.ink{fill:#17324d}.blue{fill:#155f91}.green{fill:#178467}.red{fill:#c6525b}.orange{fill:#bd7b31}.muted{fill:#60758a}
      .line{fill:none;stroke:#17324d;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.red-line{fill:none;stroke:#c6525b;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1600" height="1250" fill="#fff"/>
  <rect x="34" y="34" width="1532" height="1182" rx="28" fill="#fff" stroke="#d9e6ee" stroke-width="3" filter="url(#reg-paper-shadow)"/>

  <g class="sans">
    <text x="78" y="84" class="blue" font-size="22" font-weight="700" letter-spacing="2.5">BIOQUÍMICA II · 19 AGO. 2026 · PIZARRA RECONSTRUIDA EN LIMPIO</text>
    <text x="78" y="133" class="ink" font-size="38" font-weight="800">Puntos de regulación de la glucólisis</text>
    <text x="850" y="133" class="muted" font-size="25" font-weight="700">hexoquinasa · glucoquinasa · PFK-1</text>
    <path d="M78 153H1522" stroke="#d9e6ee" stroke-width="3"/>

    <!-- 1. Hexoquinasa -->
    <g aria-label="Regulación de la hexoquinasa">
      <text x="88" y="201" class="red" font-size="25" font-weight="800">1. HEXOQUINASA</text>
      <text x="112" y="234" class="blue" font-size="20" font-weight="700">tejido muscular</text>
      <text x="112" y="262" class="blue" font-size="20" font-weight="700">y periféricos</text>

      <circle cx="416" cy="203" r="20" fill="#f1fbf7" stroke="#178467" stroke-width="3"/>
      <path d="M406 203l7 7 14-18" fill="none" stroke="#178467" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="454" y="198" class="green" font-size="23" font-weight="700">Disponibilidad de sustratos</text>
      <text x="824" y="198" class="blue" font-size="22" font-weight="700">(presencia de glucosa)</text>
      <text x="454" y="238" class="green" font-size="23" font-weight="700">Disponibilidad de Mg²⁺</text>

      <circle cx="416" cy="294" r="20" fill="#fff5f5" stroke="#c6525b" stroke-width="3"/>
      <path d="M407 285l18 18m0-18-18 18" class="red-line"/>
      <text x="454" y="302" class="red" font-size="24" font-weight="800">Glucosa-6-fosfato</text>
    </g>

    <path d="M78 336H1522" stroke="#e5edf2" stroke-width="2"/>

    <!-- 1.1 Glucoquinasa -->
    <g aria-label="Regulación de la glucoquinasa y función de GKRP">
      <text x="88" y="385" class="red" font-size="25" font-weight="800">1.1. GLUCOQUINASA</text>
      <text x="112" y="418" class="blue" font-size="20" font-weight="700">hígado y páncreas</text>

      <circle cx="416" cy="383" r="20" fill="#f1fbf7" stroke="#178467" stroke-width="3"/>
      <path d="M406 383l7 7 14-18" fill="none" stroke="#178467" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="454" y="384" class="green" font-size="22" font-weight="800">↑ Glc</text>
      <text x="576" y="384" class="green" font-size="22">disociación de GKRP; se libera la glucoquinasa al citosol</text>
      <text x="454" y="426" class="green" font-size="22" font-weight="800">↑ Fructosa-1-fosfato</text>
      <text x="694" y="426" class="green" font-size="22">se libera la glucoquinasa al citosol</text>
      <text x="454" y="468" class="green" font-size="22" font-weight="800">↑ Insulina</text>
      <text x="576" y="468" class="green" font-size="22">induce su síntesis génica a largo plazo</text>

      <text x="91" y="500" class="orange" font-size="17" font-weight="700">No se bloquea por G6P</text>
      <text x="91" y="524" class="orange" font-size="17" font-weight="700">como la hexoquinasa, porque</text>
      <text x="91" y="548" class="orange" font-size="17" font-weight="700">la G6P se deriva a la formación</text>
      <text x="91" y="572" class="orange" font-size="17" font-weight="700">de glucógeno hepático.</text>

      <circle cx="416" cy="546" r="20" fill="#fff5f5" stroke="#c6525b" stroke-width="3"/>
      <path d="M407 537l18 18m0-18-18 18" class="red-line"/>
      <text x="454" y="544" class="red" font-size="24" font-weight="800">GKRP</text>
      <text x="532" y="544" class="red" font-size="22" font-weight="700">(proteína reguladora de la glucoquinasa)</text>
      <text x="1000" y="506" class="red" font-size="20" font-weight="800">↑ F6P</text>
      <path d="M491 558v45" class="red-line" marker-end="url(#arrow-reg-red)"/>
      <text x="454" y="635" class="red" font-size="21" font-weight="700">se une a la glucoquinasa</text>
      <path d="M737 628h124" class="red-line" marker-end="url(#arrow-reg-red)"/>
      <text x="885" y="625" class="red" font-size="21" font-weight="700">se transloca al núcleo celular,</text>
      <text x="885" y="656" class="red" font-size="21" font-weight="700">manteniéndola inactiva y retenida</text>

      <rect x="1285" y="562" width="155" height="104" rx="52" fill="#fff9f9" stroke="#c6525b" stroke-width="3"/>
      <text x="1363" y="607" class="red" font-size="19" font-weight="800" text-anchor="middle">NÚCLEO</text>
      <text x="1363" y="636" class="red" font-size="17" font-weight="700" text-anchor="middle">GCK–GKRP</text>
      <path d="M1244 630h31" class="red-line" marker-end="url(#arrow-reg-red)"/>
    </g>

    <path d="M78 700H1522" stroke="#e5edf2" stroke-width="2"/>

    <!-- 2. PFK-1 -->
    <g aria-label="Activadores e inhibidores anotados para PFK-1">
      <text x="88" y="754" class="red" font-size="25" font-weight="800">2. PFK-1</text>

      <circle cx="416" cy="750" r="20" fill="#f1fbf7" stroke="#178467" stroke-width="3"/>
      <path d="M406 750l7 7 14-18" fill="none" stroke="#178467" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="454" y="755" class="green" font-size="22" font-weight="800">↑ AMP / ADP</text>
      <text x="454" y="795" class="green" font-size="22" font-weight="800">↑ Fructosa-2,6-bisfosfato</text>
      <text x="454" y="835" class="green" font-size="22" font-weight="800">↑ Insulina</text>

      <circle cx="920" cy="750" r="20" fill="#fff5f5" stroke="#c6525b" stroke-width="3"/>
      <path d="M911 741l18 18m0-18-18 18" class="red-line"/>
      <text x="958" y="755" class="red" font-size="22" font-weight="800">↑ ATP</text>
      <text x="958" y="795" class="red" font-size="22" font-weight="800">↑ Citrato</text>
      <text x="1170" y="755" class="red" font-size="22" font-weight="800">↑ H⁺</text>
      <text x="1170" y="795" class="red" font-size="22" font-weight="800">↑ Glucagón</text>
    </g>

    <!-- Contenido añadido, deliberadamente separado de la pizarra -->
    <g aria-label="Aclaraciones didácticas añadidas">
      <rect x="78" y="882" width="1444" height="284" rx="22" fill="#eef8ff" stroke="#74b6db" stroke-width="3"/>
      <rect x="78" y="882" width="14" height="284" rx="7" fill="#2f79a9"/>
      <text x="116" y="925" class="blue" font-size="21" font-weight="800" letter-spacing="1.2">ACLARACIONES DIDÁCTICAS · NO FORMAN PARTE DEL TRAZO ORIGINAL</text>

      <circle cx="126" cy="964" r="5" fill="#2f79a9"/>
      <text x="145" y="971" class="ink" font-size="20"><tspan font-weight="800">Hexoquinasa:</tspan><tspan dx="7">el sustrato fosforilante real es MgATP²⁻; Mg²⁺ actúa como cofactor, no como activador alostérico.</tspan></text>

      <circle cx="126" cy="1007" r="5" fill="#2f79a9"/>
      <text x="145" y="1014" class="ink" font-size="20"><tspan font-weight="800">GKRP regula principalmente la glucoquinasa hepática:</tspan><tspan dx="7">F6P favorece unión y secuestro nuclear; F1P favorece liberación.</tspan></text>
      <text x="145" y="1042" class="ink" font-size="20">La glucoquinasa de la célula β pancreática no se regula por este mecanismo hepático.</text>
      <text x="145" y="1070" class="ink" font-size="20">La G6P no inhibe a la glucoquinasa y puede dirigirse, entre otros destinos, a la síntesis de glucógeno.</text>

      <circle cx="126" cy="1105" r="5" fill="#2f79a9"/>
      <text x="145" y="1112" class="ink" font-size="20"><tspan font-weight="800">Insulina y glucagón no actúan directamente sobre PFK-1.</tspan><tspan dx="7">En hígado modifican PFK-2/FBPasa-2, cambian F2,6BP y así</tspan></text>
      <text x="145" y="1140" class="ink" font-size="20">modulan PFK-1. ATP, citrato y H⁺ sí son inhibidores alostéricos directos.</text>
    </g>

    <text x="800" y="1198" class="muted" font-size="17" text-anchor="middle">Contenido, disposición y código cromático conservados; perspectiva, contraste y trazos normalizados para lectura.</text>
  </g>
</svg>
