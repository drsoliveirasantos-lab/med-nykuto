<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Complejo piruvato deshidrogenasa y sus cofactores</title>
  <desc id="desc">Esquema limpio que conecta piruvato con acetil coenzima A mediante E1, E2 y E3, con los cinco cofactores TPP, lipoato, coenzima A, FAD y NAD.</desc>
  <rect width="1200" height="760" rx="36" fill="#071521"/>
  <text x="64" y="78" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">BIOQUÍMICA II · 19 AGO. 2026</text>
  <text x="64" y="132" fill="#f8fafc" font-family="Arial,sans-serif" font-size="42" font-weight="800">Puente entre glucólisis y ciclo de Krebs</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="70" y="260" width="220" height="130" rx="24" fill="#0d3347" stroke="#38bdf8" stroke-width="3"/>
    <text x="180" y="315" fill="#bae6fd" font-size="20" font-weight="700">PIRUVATO</text><text x="180" y="352" fill="#fff" font-size="30" font-weight="800">3 carbonos</text>
    <path d="M310 325h120" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/><path d="m416 306 28 19-28 19" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="455" y="220" width="300" height="210" rx="28" fill="#172554" stroke="#818cf8" stroke-width="3"/>
    <text x="605" y="272" fill="#c7d2fe" font-size="19" font-weight="700">COMPLEJO PDH · MITOCONDRIA</text>
    <text x="605" y="322" fill="#fff" font-size="29" font-weight="800">E1 → E2 → E3</text>
    <text x="605" y="365" fill="#a5b4fc" font-size="19">Descarboxilación oxidativa</text>
    <text x="605" y="399" fill="#fcd34d" font-size="18" font-weight="700">Irreversible · CO₂ + NADH</text>
    <path d="M775 325h120" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/><path d="m881 306 28 19-28 19" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="920" y="260" width="220" height="130" rx="24" fill="#12392c" stroke="#34d399" stroke-width="3"/>
    <text x="1030" y="315" fill="#a7f3d0" font-size="20" font-weight="700">ACETIL-CoA</text><text x="1030" y="352" fill="#fff" font-size="30" font-weight="800">2 carbonos</text>
  </g>
  <g font-family="Arial,sans-serif">
    <text x="64" y="506" fill="#f8fafc" font-size="24" font-weight="800">Cinco cofactores que debes reconocer</text>
    <g font-size="19" font-weight="700">
      <rect x="64" y="540" width="190" height="112" rx="18" fill="#112b3c"/><text x="84" y="578" fill="#38bdf8">TPP · B1</text><text x="84" y="611" fill="#cbd5e1" font-size="16">E1 · descarboxila</text>
      <rect x="276" y="540" width="190" height="112" rx="18" fill="#112b3c"/><text x="296" y="578" fill="#f472b6">LIPOATO</text><text x="296" y="611" fill="#cbd5e1" font-size="16">E2 · brazo móvil</text>
      <rect x="488" y="540" width="190" height="112" rx="18" fill="#112b3c"/><text x="508" y="578" fill="#34d399">CoA · B5</text><text x="508" y="611" fill="#cbd5e1" font-size="16">Recibe el acetilo</text>
      <rect x="700" y="540" width="190" height="112" rx="18" fill="#112b3c"/><text x="720" y="578" fill="#fbbf24">FAD · B2</text><text x="720" y="611" fill="#cbd5e1" font-size="16">E3 · se reduce</text>
      <rect x="912" y="540" width="190" height="112" rx="18" fill="#112b3c"/><text x="932" y="578" fill="#a78bfa">NAD⁺ · B3</text><text x="932" y="611" fill="#cbd5e1" font-size="16">Forma NADH</text>
    </g>
  </g>
  <text x="64" y="708" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18">Pizarra reconstruida en limpio · contenido académico, no fotografía del aula.</text>
</svg>
