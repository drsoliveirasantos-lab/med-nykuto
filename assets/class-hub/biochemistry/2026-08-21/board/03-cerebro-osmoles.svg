<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Adaptación cerebral, osmoles idiogénicos y edema</title>
  <desc id="desc">Reconstrucción semántica de la tercera pizarra: una célula cerebral se adapta a la hiperosmolaridad mediante osmoles idiogénicos; una corrección brusca favorece entrada de agua, edema, herniación y muerte por paro cardiorrespiratorio. La rama de potasio y arritmia se mantiene separada.</desc>
  <defs>
    <marker id="c-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#315cc3" stroke-width="2"/></marker>
    <marker id="c-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#ce4c68" stroke-width="2"/></marker>
    <marker id="c-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#2d9a55" stroke-width="2"/></marker>
    <style>
      .board{fill:#fcfcf8;stroke:#d7d9d5;stroke-width:5}.ink{fill:#263039;stroke:#263039}.blue{fill:#315cc3;stroke:#315cc3}.red{fill:#ce4c68;stroke:#ce4c68}.green{fill:#2d9a55;stroke:#2d9a55}.orange{fill:#d98738;stroke:#d98738}
      .cell-fill{fill:#eef7fb;stroke:#263039}.brain-normal{fill:#e7f2fa;stroke:#263039}.brain-edema{fill:#dbeafe;stroke:#315cc3}.swelling{fill:#dbeafe;stroke:#315cc3;opacity:.42}.nucleus{fill:#f8fafc;stroke:#263039}
      text{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:23px;font-weight:650;stroke:none}.small{font-size:18px}.tiny{font-size:15px}.title{font-size:28px;font-weight:750}.micro{font-family:Arial,sans-serif;font-size:13px;font-weight:800;letter-spacing:1.2px}.line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.hair{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="board" x="3" y="3" width="1594" height="994" rx="18"/>

  <!-- Mismo primer bloque de la profesora, pero reconocido como célula cerebral/astrocito. -->
  <text class="blue micro" x="62" y="42">CÉLULA CEREBRAL EN MEDIO HIPEROSMOLAR</text>
  <path class="cell-fill line" d="M164 86c34 18 55 43 72 73 24-16 52-25 82-19 29 6 51 25 65 50 25-16 55-19 83-6l63-66-19 92c27 20 40 51 37 83-3 28-18 52-40 68l35 86-76-54c-27 16-60 21-92 11-22-7-39-20-52-38-24 16-54 21-83 13-26-7-47-24-60-46l-104 22 79-67c-6-29 0-59 17-83l-57-73z"/>
  <ellipse class="nucleus thin" cx="278" cy="237" rx="56" ry="38"/>
  <path class="ink hair" d="M236 234c18-15 37-17 58-5 12 7 26 7 42-1"/>
  <g class="green"><circle cx="358" cy="212" r="7"/><circle cx="392" cy="238" r="7"/><circle cx="344" cy="266" r="7"/><circle cx="410" cy="284" r="7"/><circle cx="365" cy="309" r="7"/><circle cx="322" cy="298" r="7"/></g>
  <text class="blue small" x="241" y="307">↑ soluto</text><text class="blue small" x="245" y="334">↓ agua</text>
  <path class="blue line" d="M455 328q34 40 32 91m-75-67q27 42 20 88m-66-74q19 38 9 78" marker-end="url(#c-blue)"/>
  <text class="ink small" x="92" y="423">fuera: ↓ soluto</text><text class="ink small" x="130" y="450">↑ agua</text>

  <path class="green line" d="M502 237h93" marker-end="url(#c-green)"/>
  <text class="green title" x="616" y="190">Biosíntesis</text><text class="green title" x="616" y="228">OSMOLES</text><text class="green title" x="616" y="266">IDIOGÉNICOS</text>
  <text class="green small" x="830" y="198">mioinositol · sorbitol</text><text class="blue small" x="831" y="232">glutamato · glutamina</text><text class="orange small" x="831" y="266">taurina</text>
  <path class="red thin" d="M1054 184q25 7 43 27m-43 62q25-7 43-27"/>
  <text class="red small" x="1110" y="210">formación → 24–48 h</text><text class="red small" x="1110" y="250">degradación progresiva</text>
  <path class="green thin" d="M690 286v54" marker-end="url(#c-green)"/>
  <text class="red" x="548" y="375">Sistema de defensa</text><text class="red" x="555" y="407">frente a la deshidratación</text>

  <!-- La profesora separa aquí la rama del potasio de la rama osmótica cerebral. -->
  <text class="ink" x="62" y="520">• solución salina 0,9 % (isotónica)</text>
  <text class="blue" x="63" y="574">• insulina brusca → ↓ K⁺</text>
  <path class="blue line" d="M454 566q60-88 150-83" marker-end="url(#c-blue)"/>
  <text class="blue title" x="625" y="492">ARRITMIAS</text>
  <path class="green line" d="M780 482q107 3 194 39" marker-end="url(#c-green)"/>
  <text class="green title" x="993" y="514">PARO CARDÍACO</text>
  <text class="blue small" x="995" y="546">rama por hipocalemia</text>

  <!-- Cabeza y cerebro normales: el objeto que la profesora dibuja abajo a la izquierda. -->
  <path class="ink line" d="M127 724c10-76 70-126 151-136 95-12 169 42 188 127l-4 112c-1 38-14 73-14 121m-292-2c-3-54 5-88 0-116l-31-2c-23-1-30-17-21-37l18-39-18-20c-12-14-6-30 11-39l22-12c-5-15-7-31-10-47"/>
  <path class="brain-normal line" d="M174 691c9-48 54-79 101-74 22-15 57-10 74 10 32-1 58 22 60 51 26 18 29 52 8 75 2 35-32 59-64 48-23 23-61 20-81-4-34 12-67-12-69-45-30-11-39-45-20-68-8-2-10-1-9 7z"/>
  <g class="ink hair"><path d="M208 690c24-22 48-18 65 3-3-25 18-42 40-34 15 5 21 17 17 33 17-20 48-13 51 12"/><path d="M213 736c22-14 45-9 56 10 12-19 39-26 57-10 14 12 15 29 6 43 18-7 37-2 49 12"/><path d="M292 620c-5 20 4 35 22 43m-103 72c-4 24 8 42 29 52"/></g>
  <path class="ink thin" d="M390 760q17 22 11 56"/><text class="ink tiny" x="235" y="837">cerebro adaptado · volumen conservado</text>

  <!-- Corrección demasiado rápida: el agua entra al cerebro aún rico en osmoles. -->
  <path class="green line" d="M482 758h137" marker-end="url(#c-green)"/>
  <text class="red small" x="498" y="733">corrección rápida</text>
  <path class="blue thin" d="M603 633q56 28 92 109m-74-147q66 27 103 113" marker-end="url(#c-blue)"/>
  <text class="blue small" x="538" y="612">agua entra</text>

  <!-- Segundo perfil: cerebro aumentado de volumen, surcos apretados y descenso por foramen magno. -->
  <text class="blue micro" x="694" y="574">EDEMA CEREBRAL</text>
  <path class="ink line" d="M655 724c10-76 70-126 151-136 95-12 169 42 188 127l-4 112c-1 38-14 73-14 121m-292-2c-3-54 5-88 0-116l-31-2c-23-1-30-17-21-37l18-39-18-20c-12-14-6-30 11-39l22-12c-5-15-7-31-10-47"/>
  <path class="swelling line" d="M685 681c14-56 62-93 119-91 28-12 62-5 82 16 48 2 82 40 82 86 20 29 11 69-19 88 0 37-29 68-66 69-26 20-66 18-90-6-46 13-91-17-96-64-36-18-42-66-12-92z"/>
  <path class="brain-edema line" d="M695 689c14-49 55-79 104-78 23-13 55-6 70 15 41-2 73 29 72 69 25 22 23 62-4 82-4 38-39 63-75 51-25 20-62 15-80-10-40 9-78-18-79-58-31-15-36-55-8-71z"/>
  <g class="blue hair"><path d="M733 686c22-14 45-11 61 6-1-20 18-34 37-28 13 4 20 16 17 29 20-16 47-8 55 14"/><path d="M731 736c22-12 44-6 56 12 15-18 43-20 59-3 9 10 11 23 6 34 18-6 37 1 47 16"/><path d="M798 616c-3 17 5 30 21 39"/></g>
  <path class="blue line" d="M874 793q5 43 12 73l15 62" marker-end="url(#c-blue)"/>
  <path class="red line" d="M891 817q12 31 9 76c0 21 13 38 32 45-2-30-1-55-9-81-6-19-15-32-32-40z"/>
  <text class="ink small" x="944" y="835">foramen magno</text><text class="red small" x="942" y="875">invaginación /</text><text class="red small" x="942" y="902">herniación cerebral</text>

  <!-- Las consecuencias mantienen la dirección y la conclusión escrita por la profesora. -->
  <path class="blue line" d="M1011 754q72 8 107 53" marker-end="url(#c-blue)"/>
  <text class="blue" x="1124" y="760">centro respiratorio</text><text class="blue" x="1124" y="812">centro cardiovascular</text>
  <path class="blue line" d="M1331 773v-78m5 111v-96" marker-end="url(#c-blue)"/>
  <text class="blue small" x="1248" y="650">Muerte por paro</text><text class="blue title" x="1167" y="686">cardiorrespiratorio</text>
  <text class="red small" x="1237" y="724">compresión del tronco</text><text class="red small" x="1283" y="749">encefálico</text>
</svg>
