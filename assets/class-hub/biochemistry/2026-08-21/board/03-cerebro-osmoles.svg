<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Osmoles cerebrales y corrección de la cetoacidosis</title><desc id="desc">Comparación entre adaptación cerebral a la hiperosmolaridad y riesgo de edema por descenso osmótico rápido.</desc>
  <rect width="1200" height="760" rx="36" fill="#071521"/>
  <text x="64" y="78" fill="#a78bfa" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">CAD · PIZARRA RECONSTRUIDA</text>
  <text x="64" y="132" fill="#f8fafc" font-family="Arial,sans-serif" font-size="42" font-weight="800">El cerebro se adapta: la corrección debe vigilarse</text>
  <g font-family="Arial,sans-serif">
    <rect x="64" y="190" width="500" height="430" rx="30" fill="#112b3c" stroke="#38bdf8" stroke-width="3"/>
    <text x="104" y="245" fill="#7dd3fc" font-size="21" font-weight="700">ANTES DEL TRATAMIENTO</text>
    <text x="104" y="294" fill="#fff" font-size="28" font-weight="800">Hiperglucemia → plasma hiperosmolar</text>
    <circle cx="314" cy="430" r="108" fill="#172554" stroke="#818cf8" stroke-width="6"/>
    <circle cx="270" cy="400" r="12" fill="#fbbf24"/><circle cx="330" cy="375" r="12" fill="#fbbf24"/><circle cx="360" cy="455" r="12" fill="#fbbf24"/><circle cx="275" cy="475" r="12" fill="#fbbf24"/>
    <text x="314" y="430" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">Osmoles</text><text x="314" y="459" text-anchor="middle" fill="#c7d2fe" font-size="18">idiogénicos ↑</text>
    <text x="104" y="580" fill="#bae6fd" font-size="18">Ayudan a conservar agua dentro de la célula cerebral.</text>
    <rect x="636" y="190" width="500" height="430" rx="30" fill="#391725" stroke="#fb7185" stroke-width="3"/>
    <text x="676" y="245" fill="#fda4af" font-size="21" font-weight="700">DURANTE LA CORRECCIÓN</text>
    <text x="676" y="294" fill="#fff" font-size="28" font-weight="800">Osmolalidad efectiva desciende</text>
    <circle cx="886" cy="430" r="132" fill="#312e81" stroke="#a78bfa" stroke-width="8"/>
    <path d="M705 365h80M987 365h80M705 495h80M987 495h80" stroke="#7dd3fc" stroke-width="7"/>
    <path d="m772 347 25 18-25 18m202-36-25 18 25 18m-202 94 25 18-25 18m202-36-25 18 25 18" fill="none" stroke="#7dd3fc" stroke-width="7"/>
    <text x="886" y="422" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">Agua entra</text><text x="886" y="456" text-anchor="middle" fill="#fecdd3" font-size="20">edema cerebral</text>
    <text x="676" y="580" fill="#fecdd3" font-size="18">Riesgo clínico que exige monitorización neurológica estrecha.</text>
  </g>
  <text x="64" y="690" fill="#fcd34d" font-family="Arial,sans-serif" font-size="21" font-weight="700">Vigilar: estado mental, cefalea, vómitos, bradicardia y cambios neurológicos. Seguir el protocolo institucional.</text>
</svg>
