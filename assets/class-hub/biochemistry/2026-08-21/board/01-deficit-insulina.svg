<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cadena causal del déficit de insulina</title><desc id="desc">Esquema de cetoacidosis diabética desde déficit de insulina hasta hiperglucemia, deshidratación, lipólisis y cetosis.</desc>
  <rect width="1200" height="760" rx="36" fill="#08131f"/>
  <text x="64" y="78" fill="#fb7185" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">BIOQUÍMICA II · 21 AGO. 2026</text>
  <text x="64" y="132" fill="#f8fafc" font-family="Arial,sans-serif" font-size="42" font-weight="800">Déficit de insulina: dos rutas que convergen</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="425" y="178" width="350" height="92" rx="22" fill="#4c1427" stroke="#fb7185" stroke-width="3"/><text x="600" y="218" fill="#fecdd3" font-size="19" font-weight="700">INSULINA EFECTIVA ↓</text><text x="600" y="250" fill="#fff" font-size="24" font-weight="800">Glucagón y catecolaminas ↑</text>
    <path d="M520 275 335 350M680 275 865 350" stroke="#94a3b8" stroke-width="6" fill="none"/>
    <rect x="80" y="350" width="510" height="250" rx="28" fill="#102c3e" stroke="#38bdf8" stroke-width="3"/>
    <text x="335" y="395" fill="#7dd3fc" font-size="21" font-weight="700">RUTA DE LA GLUCOSA</text>
    <text x="335" y="445" fill="#fff" font-size="25" font-weight="800">Captación ↓ + producción hepática ↑</text><text x="335" y="492" fill="#bae6fd" font-size="23">Hiperglucemia → glucosuria</text><text x="335" y="538" fill="#bae6fd" font-size="23">Diuresis osmótica → deshidratación</text><text x="335" y="575" fill="#fcd34d" font-size="18" font-weight="700">Pérdida de agua y electrolitos</text>
    <rect x="610" y="350" width="510" height="250" rx="28" fill="#35220e" stroke="#fbbf24" stroke-width="3"/>
    <text x="865" y="395" fill="#fcd34d" font-size="21" font-weight="700">RUTA DE LAS GRASAS</text>
    <text x="865" y="445" fill="#fff" font-size="25" font-weight="800">Lipólisis ↑ → ácidos grasos libres</text><text x="865" y="492" fill="#fde68a" font-size="23">β-oxidación → acetil-CoA</text><text x="865" y="538" fill="#fde68a" font-size="23">Cetogénesis → H⁺</text><text x="865" y="575" fill="#fb7185" font-size="18" font-weight="700">Acidosis metabólica con brecha aniónica</text>
  </g>
  <path d="M335 610 520 680M865 610 680 680" stroke="#a78bfa" stroke-width="6" fill="none"/>
  <text x="600" y="708" fill="#ddd6fe" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="800">CETOACIDOSIS DIABÉTICA · emergencia metabólica</text>
</svg>
