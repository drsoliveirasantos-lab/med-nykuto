<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Mapa general de la glucólisis</title>
  <desc id="desc">Resumen visual de la glucólisis: ubicación, fases, balance, regulación y destinos del piruvato.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122b45"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f2c66d"/><stop offset="1" stop-color="#6fd8ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".32"/></filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#8eb6d8" stroke-opacity=".055"/></pattern>
    <style><![CDATA[
      text{font-family:Inter,Arial,sans-serif}.k{fill:#ffe2a3;font-size:23px;font-weight:800;letter-spacing:5px}.page{fill:#6fd8ff;font-size:22px;font-weight:800}.h1{fill:#f7f9fc;font-size:92px;font-weight:800;letter-spacing:-3px}.sub{fill:#aebbd0;font-size:31px}.label{fill:#6fd8ff;font-size:21px;font-weight:800;letter-spacing:3px}.big{fill:#f7f9fc;font-size:36px;font-weight:800}.small{fill:#aebbd0;font-size:25px}.flow{fill:#f7f9fc;font-size:29px;font-weight:750}.result{fill:#07111f;font-size:32px;font-weight:900}.result2{fill:#07111f;font-size:25px;font-weight:750}
    ]]></style>
  </defs>
  <rect width="1080" height="1350" rx="50" fill="url(#bg)"/>
  <rect width="1080" height="1350" rx="50" fill="url(#grid)"/>
  <circle cx="985" cy="120" r="230" fill="#6fd8ff" opacity=".07"/><circle cx="75" cy="1260" r="260" fill="#f2c66d" opacity=".06"/>
  <g transform="translate(72 70)">
    <text class="k" y="26">ARCHIVO DE LA PIZARRA</text><text class="page" x="936" y="26" text-anchor="end">01 / 07</text>
    <rect y="55" width="936" height="3" rx="2" fill="url(#accent)"/>
    <text class="h1" y="168">Glucólisis</text>
    <text class="sub" y="220">La vía común de la glucosa · clase del 14/08</text>

    <g transform="translate(0 278)" filter="url(#shadow)">
      <rect width="936" height="250" rx="34" fill="#0b1b2d" stroke="#6fd8ff" stroke-opacity=".25"/>
      <text class="label" x="38" y="49">RECORRIDO</text>
      <g transform="translate(38 78)">
        <rect width="210" height="112" rx="24" fill="#142c45" stroke="#f2c66d" stroke-opacity=".34"/>
        <text class="big" x="105" y="52" text-anchor="middle">1 glucosa</text><text class="small" x="105" y="85" text-anchor="middle">6 carbonos</text>
        <path d="M230 56h72" stroke="#ffe2a3" stroke-width="5" stroke-linecap="round"/><path d="m292 44 15 12-15 12" fill="none" stroke="#ffe2a3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="326" width="238" height="112" rx="24" fill="#142c45" stroke="#6fd8ff" stroke-opacity=".32"/>
        <text class="big" x="445" y="51" text-anchor="middle">10 reacciones</text><text class="small" x="445" y="84" text-anchor="middle">en el citosol</text>
        <path d="M586 56h72" stroke="#ffe2a3" stroke-width="5" stroke-linecap="round"/><path d="m648 44 15 12-15 12" fill="none" stroke="#ffe2a3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="682" width="216" height="112" rx="24" fill="#142c45" stroke="#72e0ab" stroke-opacity=".4"/>
        <text class="big" x="790" y="52" text-anchor="middle">2 piruvatos</text><text class="small" x="790" y="85" text-anchor="middle">3 carbonos c/u</text>
      </g>
    </g>

    <g transform="translate(0 558)">
      <g><rect width="452" height="150" rx="28" fill="#0d2035" stroke="#f2c66d" stroke-opacity=".25"/><text class="label" x="28" y="42">FASE 1 · PREPARATORIA</text><text class="big" x="28" y="91">Invierte 2 ATP</text><text class="small" x="28" y="124">Activa y divide la glucosa</text></g>
      <g transform="translate(484)"><rect width="452" height="150" rx="28" fill="#0d2035" stroke="#72e0ab" stroke-opacity=".28"/><text class="label" x="28" y="42" fill="#72e0ab">FASE 2 · BENEFICIO</text><text class="big" x="28" y="91">Produce 4 ATP</text><text class="small" x="28" y="124">Más 2 NADH y 2 piruvatos</text></g>
    </g>

    <g transform="translate(0 738)">
      <rect width="936" height="206" rx="30" fill="#091827" stroke="#c5d7ef" stroke-opacity=".16"/>
      <text class="label" x="30" y="46">CUATRO IDEAS PARA UBICARSE</text>
      <g transform="translate(30 76)">
        <circle cx="20" cy="20" r="20" fill="#6fd8ff" opacity=".16"/><text class="page" x="20" y="28" text-anchor="middle">1</text><text class="flow" x="54" y="29">Ocurre en el citosol</text>
        <circle cx="486" cy="20" r="20" fill="#6fd8ff" opacity=".16"/><text class="page" x="486" y="28" text-anchor="middle">2</text><text class="flow" x="520" y="29">No usa O₂ directamente</text>
        <circle cx="20" cy="82" r="20" fill="#f2c66d" opacity=".16"/><text class="page" x="20" y="90" text-anchor="middle">3</text><text class="flow" x="54" y="91">Tiene 2 fases</text>
        <circle cx="486" cy="82" r="20" fill="#f2c66d" opacity=".16"/><text class="page" x="486" y="90" text-anchor="middle">4</text><text class="flow" x="520" y="91">Posee 3 puntos de control</text>
      </g>
    </g>

    <g transform="translate(0 974)">
      <rect width="936" height="162" rx="30" fill="url(#accent)"/>
      <text class="result" x="468" y="61" text-anchor="middle">BALANCE NETO POR GLUCOSA</text>
      <text class="result2" x="468" y="111" text-anchor="middle">2 PIRUVATOS  ·  2 ATP  ·  2 NADH</text>
    </g>

    <g transform="translate(0 1148)">
      <text class="label" y="27">DESTINO DEL PIRUVATO</text>
      <text class="small" y="65"><tspan fill="#72e0ab" font-weight="800">O₂ suficiente:</tspan> oxidación mitocondrial y respiración celular.</text>
      <text class="small" y="104"><tspan fill="#ff9a9a" font-weight="800">O₂ limitado o sin mitocondrias:</tspan> lactato y regeneración de NAD⁺.</text>
    </g>
  </g>
</svg>
